[package]
name = "croppers"
version = "0.1.0"
edition = "2024"

[dependencies]
wgpu = { version = "30.0.1", features = ["webgl"] }
winit = { version = "0.30", features = ["rwh_06"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
egui = "0.36.2"
egui-wgpu = "0.36.2"
log = "0.4"
pollster = "1.0.1"
egui-winit = { version = "0.36.2", features = [] }
env_logger = "0.11.11"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
itertools = "0.15.0"
dyn-clone = "1.0.20"
enum-iterator = "2.3.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", features = ["preserve_order"] }
directories = "6.0.0"
ron = "0.12.2"
rfd = "0.17.2"
egui-elegance = "0.16.2"

[profile.release]
opt-level = 3
# debug = "line-tables-only"

[profile.publishable]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
